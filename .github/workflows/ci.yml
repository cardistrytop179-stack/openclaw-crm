name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

# Добавьте разрешения для безопасности
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    # ИСПРАВЛЕНО: Все команды внутри run должны иметь правильный отступ
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest ruff bandit safety pytest-cov
    
    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .
    
    # Добавлена генерация отчётов о покрытии
    - name: Run tests
      run: |
        python -m pytest -v --tb=short --cov=. --cov-report=xml --cov-report=html -o junitxml=test-reports/junit.xml
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-reports/
          .coverage
          coverage.xml
          htmlcov/

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # ИСПРАВЛЕНО: Отступ для pip install
    - name: Install security tools
      run: |
        pip install .
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r src/openclaw_crm -f json -o bandit-report.json || true
        bandit -r src/openclaw_crm -f screen || true  # Добавлен вывод в консоль
    
    # ИСПРАВЛЕНО: safety check устарел, используйте safety scan
    - name: Run Safety check
      run: |
        safety scan --json --output safety-report.json || true
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        pip install build
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/

  publish-docs:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Generate documentation
      run: |
        echo "# OpenClaw CRM Documentation" > docs.md
        echo "Automatically generated documentation" >> docs.md
        echo "Project: openclaw-crm" >> docs.md
        echo "Version: 0.1.0" >> docs.md
    
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs.md
