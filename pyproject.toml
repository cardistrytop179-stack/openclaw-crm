[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-crm"
version = "0.1.0"
description = "Lightweight CRM backed by Google Sheets with spider-network referral tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Chinchilla AI", email = "engineering@chinchilla.ai"},
]
keywords = ["crm", "google-sheets", "pipeline", "referral-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
openclaw-crm = "openclaw_crm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_crm"]

[tool.ruff]
line-length = 120
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused import

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit", "safety"]
test = ["pytest", "pytest-cov"]
docs = []
